name: Documentation

# Builds the Sphinx site (doc/) as a check on pull requests that touch doc/.
# Not run on pushes: the site need not be rebuilt for every commit.
# Publishing to GitHub Pages is the separate docs-deploy.yml workflow.
# Uses only actions/checkout; doc/ci_build.sh installs the pinned toolchain.

on:
  pull_request:
    branches:
      - develop
    paths:
      - "doc/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}    # gh release download gallery-assets
        run: bash doc/ci_build.sh
